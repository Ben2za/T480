monitor=,preferred,auto,1

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,Wayland

misc {
	disable_hyprland_logo = true
	disable_splash_rendering = true
}

input {
	kb_layout = fr
	follow_mouse = 1
	sensitivity = 0
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(8b0000ff)
	col.inactive_border = rgba(2a2a2dff)
	layout = dwindle
}

decoration {
	rounding = 3
}

animations {
	enabled = yes
	bezier = myBezier, 0.05, 0.9, 0.1, 1.05
	animation = windows, 1, 4, myBezier
	animation = fade, 1, 4, default
}

dwindle {
	preserve_split = yes
}

bind = SUPER, RETURN, exec, kitty
bind = SUPER, Q, killactive,
bind = SUPER, M, exit,
bind = SUPER, R, exec, wofi --show drun
bind = SUPER, C, exec, kitty --class CTOS_CONTROL --title CTOS_CONTROL /home/operator/T480/scripts/ctos-control tui
bind = SUPER SHIFT, V, exec, kitty --class CTOS_VOICE --title CTOS_VOICE /home/operator/T480/scripts/ctos-voice-ptt
bind = SUPER, L, exec, hyprlock
bind = , Print, exec, /home/operator/T480/scripts/ctos-screenshot full
bind = SHIFT, Print, exec, /home/operator/T480/scripts/ctos-screenshot region
bind = , XF86AudioRaiseVolume, exec, /home/operator/T480/scripts/ctos-audio up
bind = , XF86AudioLowerVolume, exec, /home/operator/T480/scripts/ctos-audio down
bind = , XF86AudioMute, exec, /home/operator/T480/scripts/ctos-audio mute
bind = SHIFT, XF86AudioRaiseVolume, exec, /home/operator/T480/scripts/ctos-audio up 10
bind = SHIFT, XF86AudioLowerVolume, exec, /home/operator/T480/scripts/ctos-audio down 10
bind = SUPER, Page_Up, exec, /home/operator/T480/scripts/ctos-audio up 10
bind = SUPER, Page_Down, exec, /home/operator/T480/scripts/ctos-audio down 10
bind = SUPER SHIFT, Page_Up, exec, /home/operator/T480/scripts/ctos-audio mic-up 5
bind = SUPER SHIFT, Page_Down, exec, /home/operator/T480/scripts/ctos-audio mic-down 5
bind = SUPER, BackSpace, exec, /home/operator/T480/scripts/ctos-audio mute
bind = SUPER SHIFT, BackSpace, exec, /home/operator/T480/scripts/ctos-audio mic-mute
bind = SUPER, A, exec, /home/operator/T480/scripts/ctos-audio panel
bind = SUPER SHIFT, A, exec, /home/operator/T480/scripts/ctos-audio mixer

bind = SUPER, 1, workspace , 1
bind = SUPER, 2, workspace , 2
bind = SUPER, 3, workspace , 3
bind = SUPER, 4, workspace , 4
bind = SUPER, 5, workspace , 5
bind = SUPER, 6, workspace , 6
bind = SUPER, 7, workspace , 7
bind = SUPER, 8, workspace , 8

bind = SUPER, ampersand, workspace , 1
bind = SUPER, eacute, workspace , 2
bind = SUPER, quotedbl, workspace , 3
bind = SUPER, apostrophe, workspace , 4
bind = SUPER, parenleft, workspace , 5
bind = SUPER, minus, workspace , 6
bind = SUPER, egrave, workspace , 7
bind = SUPER, underscore, workspace , 8

exec-once = /home/operator/T480/scripts/ctos-wallpaper
exec-once = waybar > /tmp/waybar.log 2>&1 &
exec-once = mako
exec-once = /home/operator/T480/scripts/ctos-session boot



# CTOS Auto Session

workspace = 2, gapsin:0, gapsout:0, bordersize:0, rounding:false

windowrule = match:class ^(CTOS_CONTROL)$, match:title ^(CTOS_CONTROL)$, workspace 1 silent
windowrule = match:class ^(CTOS_DESK)$, match:title ^(CTOS_DESK)$, workspace 2 silent
windowrule = match:class ^(Vncviewer)$, workspace 2 silent
windowrule = border_size 0, match:class ^(Vncviewer)$
windowrule = rounding 0, match:class ^(Vncviewer)$
windowrule = match:class ^(CTOS_VMS)$, match:title ^(CTOS_VMS)$, workspace 4 silent
windowrule = match:class ^(virt-manager)$, workspace 4 silent
windowrule = match:class ^(CTOS_VOICE)$, match:title ^(CTOS_VOICE)$, workspace 5 silent
